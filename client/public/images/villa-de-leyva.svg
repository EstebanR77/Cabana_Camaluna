<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7eb6dc"/>
      <stop offset="100%" stop-color="#b8d4e4"/>
