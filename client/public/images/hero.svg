<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8db4d4"/>
      <stop offset="60%" stop-color="#c8d8c4"/>
      <stop offset="100%" stop-color="#a8b89a"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7a5e"/>
      <stop offset="100%" stop-color="#4a5a3e"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9d7e"/>
      <stop offset="100%" stop-color="#5e6e54"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2a878"/>
      <stop offset="100%" stop-color="#a08a5c"/>
    </linearGradient>
  </defs>

  <!-- Cielo -->
  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- Sol suave -->
  <circle cx="1100" cy="220" r="85" fill="#ffd9a3" opacity="0.55"/>
  <circle cx="1100" cy="220" r="50" fill="#ffe8c4" opacity="0.7"/>

  <!-- Nubes lejanas -->
  <ellipse cx="300" cy="180" rx="120" ry="18" fill="#fff" opacity="0.5"/>
  <ellipse cx="700" cy="140" rx="160" ry="22" fill="#fff" opacity="0.4"/>
  <ellipse cx="1350" cy="180" rx="110" ry="16" fill="#fff" opacity="0.45"/>

  <!-- Montañas atrás -->
  <path d="M 0 480 L 180 320 L 320 400 L 480 280 L 640 380 L 800 300 L 960 360 L 1120 290 L 1280 380 L 1440 320 L 1600 400 L 1600 800 L 0 800 Z" fill="url(#mountain1)" opacity="0.85"/>

  <!-- Montañas medias -->
  <path d="M 0 560 L 120 460 L 280 510 L 420 430 L 580 500 L 760 440 L 920 510 L 1080 450 L 1240 510 L 1400 470 L 1600 540 L 1600 800 L 0 800 Z" fill="url(#mountain2)"/>

  <!-- Suelo -->
  <path d="M 0 620 L 1600 620 L 1600 800 L 0 800 Z" fill="url(#ground)"/>

  <!-- Pueblo blanco (casas estilo Villa de Leyva) -->
  <g transform="translate(580, 540)">
    <!-- Iglesia central -->
    <rect x="170" y="20" width="80" height="80" fill="#f5f0e6"/>
    <polygon points="170,20 250,20 210,-10" fill="#a85c3a"/>
    <rect x="200" y="40" width="20" height="40" fill="#5e4a3a"/>
    <!-- Casas a la izquierda -->
    <rect x="40" y="50" width="60" height="50" fill="#f5f0e6"/>
    <polygon points="40,50 100,50 70,30" fill="#a85c3a"/>
    <rect x="100" y="40" width="70" height="60" fill="#ffffff"/>
    <polygon points="100,40 170,40 135,20" fill="#b86a48"/>
    <!-- Casas a la derecha -->
    <rect x="250" y="40" width="70" height="60" fill="#ffffff"/>
    <polygon points="250,40 320,40 285,20" fill="#b86a48"/>
    <rect x="320" y="50" width="80" height="50" fill="#f5f0e6"/>
    <polygon points="320,50 400,50 360,28" fill="#a85c3a"/>
    <!-- Ventanas -->
    <rect x="55" y="65" width="12" height="18" fill="#4a3a2a"/>
    <rect x="80" y="65" width="12" height="18" fill="#4a3a2a"/>
    <rect x="115" y="55" width="14" height="20" fill="#4a3a2a"/>
    <rect x="140" y="55" width="14" height="20" fill="#4a3a2a"/>
    <rect x="265" y="55" width="14" height="20" fill="#4a3a2a"/>
    <rect x="290" y="55" width="14" height="20" fill="#4a3a2a"/>
    <rect x="340" y="65" width="12" height="18" fill="#4a3a2a"/>
    <rect x="365" y="65" width="12" height="18" fill="#4a3a2a"/>
  </g>

  <!-- Árboles pequeños esparcidos -->
  <g fill="#4a5a3e">
    <ellipse cx="180" cy="640" rx="14" ry="22"/>
    <ellipse cx="220" cy="650" rx="11" ry="18"/>
    <ellipse cx="1100" cy="640" rx="14" ry="22"/>
    <ellipse cx="1140" cy="650" rx="11" ry="18"/>
    <ellipse cx="1320" cy="635" rx="13" ry="20"/>
  </g>
</svg>
