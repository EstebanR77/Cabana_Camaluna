<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e4d0"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8845a"/>
      <stop offset="100%" stop-color="#7a5c3e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="280" fill="url(#wall)"/>
  <rect y="280" width="600" height="120" fill="url(#floor)"/>
  <!-- Escaleras a la izquierda -->
  <g fill="#6b4a32">
    <rect x="40" y="120" width="180" height="14"/>
    <rect x="40" y="150" width="180" height="14"/>
    <rect x="40" y="180" width="180" height="14"/>
    <rect x="40" y="210" width="180" height="14"/>
    <rect x="40" y="240" width="180" height="14"/>
  </g>
  <!-- Barandal -->
  <rect x="40" y="80" width="6" height="180" fill="#3a2a1a"/>
  <rect x="220" y="80" width="6" height="180" fill="#3a2a1a"/>
  <!-- Lámpara colgante -->
  <line x1="380" y1="0" x2="380" y2="80" stroke="#3a2a1a" stroke-width="2"/>
  <ellipse cx="380" cy="100" rx="35" ry="25" fill="#f9d894"/>
  <ellipse cx="380" cy="100" rx="35" ry="25" fill="none" stroke="#6b4a32" stroke-width="2"/>
  <!-- Sofá -->
  <rect x="320" y="280" width="240" height="60" rx="8" fill="#8a6b4a"/>
  <rect x="330" y="270" width="60" height="20" rx="4" fill="#a08260"/>
  <rect x="400" y="270" width="60" height="20" rx="4" fill="#a08260"/>
  <rect x="470" y="270" width="60" height="20" rx="4" fill="#a08260"/>
  <!-- Mesa -->
  <rect x="290" y="345" width="60" height="40" fill="#5a3e28"/>
</svg>
